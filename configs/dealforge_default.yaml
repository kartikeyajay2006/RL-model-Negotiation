scenario:
  horizon_range: [10, 30]
  market_uncertainty_range: [0.10, 0.95]
  competitor_intensity_range: [0.05, 0.95]
  relationship_sensitivity_range: [0.2, 1.3]
  latent_liability_factor_range: [0.0, 1.0]
  initial_price_signal_range: [0.15, 0.85]
  initial_risk_score_range: [0.1, 0.6]
  initial_trust_score_range: [0.2, 0.8]
  initial_external_pressure_range: [0.0, 0.5]
  initial_clauses:
    - id: pricing
      ambiguity: 0.3
      required_terms_complete: true
    - id: sla
      ambiguity: 0.4
      required_terms_complete: true

seller_agent:
  minimum_price_range: [0.2, 0.95]
  walkaway_tolerance_range: [0.1, 0.8]
  bluff_factor_range: [0.0, 1.0]
  temperature_range: [0.4, 2.4]
  counter_delta_range: [0.01, 0.22]
  reject_floor_probability: 0.08
  message_styles: [direct, guarded, collaborative, adversarial]

legal_agent:
  base_legal_risk: 0.18
  risk_noise_std: 0.07
  penalty_scale: 1.0

risk_agent:
  base_risk: 0.2
  uncertainty_weight: 0.42
  volatility_weight: 0.25
  pressure_weight: 0.2
  inertia: 0.65
  noise_std: 0.06

competitor_agent:
  event_probability: 0.25
  shock_scale: 0.28

observation:
  history_window: 6

dynamics:
  delay_pressure_drift: [0.01, 0.09]
  question_information_gain: [0.01, 0.11]
  trust_update:
    accept: 0.05
    reject: -0.06
    counter: -0.01
    legal_penalty_weight: 0.06

reward:
  running_discount: 0.99
  weights:
    profit_optimization: 0.30
    risk_penalty: 0.22
    time_efficiency: 0.14
    strategic_behavior: 0.17
    long_term_outcome: 0.17

  profit_component:
    acceptance_importance: 0.60
    squash_scale: 2.0

  risk_component:
    live_risk_weight: 0.50
    legal_risk_weight: 0.35
    latent_risk_weight: 0.15
    delayed_effect_weight: 1.00
    squash_scale: 2.5

  time_component:
    urgency_exponent: 1.5
    delay_action_penalty: 0.15
    timely_question_bonus: 0.05
    question_bonus_cutoff: 0.40

  strategic_component:
    trace_window: 6
    repetition_check_window: 3
    repetition_penalty: 0.10
    diversity_weight: 0.50
    alignment_weight: 0.50

  long_term_component:
    outstanding_penalty_weight: 0.20
    trust_weight: 0.70
    pressure_weight: 0.30
    success_scale: 1.00
    failure_scale: 1.00
    deadline_scale: 0.50

  anti_exploit:
    component_clip: 3.0
    oscillation_tolerance: 0.80
    oscillation_weight: 0.05
    bounded_bonus_weight: 0.02

  delayed_effects:
    risk_trigger_weight: 0.50
    legal_trigger_weight: 0.30
    latent_trigger_weight: 0.20
    accept_multiplier: 1.40
    spawn_scale: 0.80
    delay_range: [1, 4]
    magnitude_range: [0.01, 0.20]

termination:
  accept_sensitivity: 1.0
  risk_weight: 0.5
  pressure_weight: 0.3
  trust_weight: 0.2
  reject_failure_probability: 0.65
